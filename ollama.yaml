ollama:
  gpu:
    enabled: true
    models:
    - llama3
persistentVolume:
  enabled: true
  size: 100Gi

replicaCount: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

resources:
  requests: 
    memory: 4096Mi
    cpu: 2000m
    nvidia.com/gpu: 1
  

extraEnv:
  - name: OLLAMA_NUM_PARALLEL
    value: "3"
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "3"
